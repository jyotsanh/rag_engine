# Phase 1 brings up MongoDB + the RAG Engine API. Services for later phases are
# stubbed below (commented) so the topology is visible; uncomment as each lands.

services:
  mongo:
    image: mongo:7
    container_name: rag_engine_mongo
    ports:
      # host 27020 → container 27017, matching settings.MONGO_PORT so a local
      # `uv run dev` and the containerised api both reach the same instance.
      - "27020:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build: .
    container_name: rag_engine_api
    command: server # → the `server` console script (rag_engine:server), binds 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      # Reach Mongo over the compose network, not localhost. Use Mongo's
      # CONTAINER-internal port (27017) — NOT the host-published 27020; the
      # "27020:27017" mapping only affects the host, not container-to-container
      # traffic. These override the settings defaults.
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
    env_file:
      - .env          # uncomment once you keep a .env with secrets (Phase 9)
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

