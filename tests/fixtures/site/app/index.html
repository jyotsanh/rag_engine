<!doctype html>
<html lang="en">

  <title>Widget configurator | Acme Widgets</title>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script>

      "<p>The configurator supports the WX-2048 and WX-4096 chassis.</p>" +

  });
</script>
</body>
</html>
