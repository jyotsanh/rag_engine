[project]
name = "rag-engine"
version = "0.1.0"
description = "Multi-tenant service that crawls a website, chunks and embeds its content, and serves dense/hybrid search over it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jyotsan", email = "jyotsan@getblys.com" }]
dependencies = [
    "fastapi>=0.120",
    "loguru>=0.7.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "uvicorn[standard]>=0.40",
]

[project.scripts]
dev = "rag_engine:dev"
server = "rag_engine:server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# rag_engine as package
[tool.hatch.build.targets.wheel]
packages = ["rag_engine"]

[dependency-groups] # development dependencies are local-only, not in project requirements
dev = [
    "asgi-lifespan>=2.1",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "pymupdf>=1.26",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "ruff>=0.14",
    "testcontainers[mongodb,qdrant,redis]>=4.13",
    "ty>=0.0.1a20",
]

### linting and formatting (ruff)
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"] # allow Depends() defaults for FastAPI

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["rag_engine"]

## type checking (astral ty)
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["rag_engine", "tests"]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.terminal]
output-format = "concise"

## tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated; no containers or external network, loopback fixture site allowed (auto-applied under tests/unit)",
    "integration: real MongoDB/Redis/Qdrant via testcontainers (auto-applied under tests/integration)",
    "browser: needs Playwright Chromium",
    "live: hits real external services (OpenAI, public websites); needs --run-live",
    "eval: retrieval quality evaluation",
]
filterwarnings = [
    # test containers serve Qdrant over plain http on localhost
    "ignore:Api key is used with an insecure connection:UserWarning",
]
