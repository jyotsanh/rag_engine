[project]
name = "rag-engine"
version = "0.1.0"
description = "Multi-tenant service that crawls a website, chunks and embeds its content, and serves dense/hybrid search over it."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "jyotsanh", email = "hamaljyotsan@gmail.com" }]
dependencies = [
    "charset-normalizer>=3.4",
    "defusedxml>=0.7.1",
    "fastapi>=0.120",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "idna>=3.10",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "playwright>=1.64.1",
    "protego>=0.7.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "pymongo>=4.19",
    "qdrant-client>=1.19.1",
    "redis>=6.4",
    "tldextract>=5.3",
    "uvicorn[standard]>=0.40",
    "zttp>=0.0.34",
    "zuvloop>=0.0.17",
]

[project.scripts]
dev = "rag_engine:dev"
server = "rag_engine:server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# rag_engine as package
[tool.hatch.build.targets.wheel]
packages = ["rag_engine"]

[dependency-groups] # development dependencies are local-only, not in project requirements
dev = [
    "asgi-lifespan>=2.1",
    "hypothesis>=6.140",
    "openpyxl>=3.1",
    "pymupdf>=1.26",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-timeout>=2.4",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "ruff>=0.14",
    "testcontainers[mongodb,qdrant,redis]>=4.13",
    "trustme>=1.2",
    "ty>=0.0.1a20",
    "types-lxml>=2026.2.16",
]

### linting and formatting (ruff)
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"] # allow Depends() defaults for FastAPI

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["rag_engine"]

## type checking (astral ty)
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["rag_engine", "tests"]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.terminal]
output-format = "concise"

## tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
# a hung test fails by name instead of stalling the whole run
timeout = 120
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated; no containers or external network, loopback fixture site allowed (auto-applied under tests/unit)",
    "integration: real MongoDB/Redis/Qdrant via testcontainers (auto-applied under tests/integration)",
    "browser: needs Playwright Chromium",
    "container: builds and runs the Docker images (opt-in: --run-container)",
    "live: hits real external services (OpenAI, public websites); needs --run-live",
    "eval: retrieval quality evaluation",
]
filterwarnings = [
    # test containers serve Qdrant over plain http on localhost
    "ignore:Api key is used with an insecure connection:UserWarning",
]
