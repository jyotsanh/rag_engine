[project]
name = "rag-engine"
version = "0.1.0"
description = "Give it a website link — crawl, embed, and answer questions over it with cited sources."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jyotsan", email = "jyotsan@getblys.com" }]
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "loguru>=0.7.3",
    "pymongo>=4.16.0",
]

[project.scripts]
dev = "rag_engine:dev"
server = "rag_engine:server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# rag_engine as package
[tool.hatch.build.targets.wheel]
packages = ["rag_engine"]

[dependency-groups] # development dependencies are local-only, not in project requirements
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",      # astral formatter + linter, faster than black/flake8
    "ty>=0.0.12",       # astral type checker, faster than mypy
]

### linting and formatting (ruff)
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # allow Depends() defaults for FastAPI

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["rag_engine"]

## type checking (astral ty)
[tool.ty.environment]
root = ["./rag_engine"]
python = "./.venv"
python-version = "3.12"

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.terminal]
output-format = "concise"
